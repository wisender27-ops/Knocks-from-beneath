name: Request Unity activation file

# One-time manual step to unlock CI: run this workflow (Actions tab → this workflow → Run workflow),
# download the produced .alf artifact, upload it at https://license.unity3d.com/manual to get back
# a .ulf file, then paste that .ulf file's contents into a repo secret named UNITY_LICENSE
# (Settings → Secrets and variables → Actions). tests.yml reads that secret on every push/PR.
# Once UNITY_LICENSE is set, this workflow is never needed again — safe to leave in place.
on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        id: activation
        with:
          unityVersion: auto

      - uses: actions/upload-artifact@v4
        with:
          name: activation-file
          path: ${{ steps.activation.outputs.filePath }}
